name: Render Daily Video
on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      - name: Download Image from Drive
        run: |
          wget --no-check-certificate 'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' -O input.jpg

      - name: Render Video with Music
        run: |
          # Pick a random track
          SELECTED_MUSIC=$(ls music/*.mp3 | shuf -n 1)
          
          # FFmpeg Command Breakdown:
          # 1. scale=8000: Ensures high quality for the zoom
          # 2. zoompan: Creates that slow, cinematic 'breathing' effect
          # 3. drawtext: We use 'w*0.8' inside the box width to wrap text safely
          ffmpeg -loop 1 -i input.jpg -stream_loop -1 -i "$SELECTED_MUSIC" -vf \
          "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=text='${{ github.event.client_payload.quote }}': \
          fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2: \
          box=1:boxcolor=black@0.5:boxborderw=40: \
          line_spacing=20:fix_bounds=1:boxborderw=50" \
          -c:v libx264 -t 10 -pix_fmt yuv420p -c:a aac -shortest output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      - name: Tell Google to Upload
        run: |
          curl -L -X POST "${{ secrets.GAS_WEB_APP_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"action": "upload", "file_id": "DAILY_OUTPUT_ID", "quote": "${{ github.event.client_payload.quote }}"}'

      - name: Upload Video to Drive and Trigger YouTube
        run: |
          # 1. Upload the actual video file (output.mp4) to your Google Web App
          # We send the file as base64 so the Google Script can rebuild it as a file
          VIDEO_BASE64=$(base64 -w 0 output.mp4)
          
          curl -L -X POST "${{ secrets.GAS_WEB_APP_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"action\": \"upload_to_youtube\",
            \"video_data\": \"$VIDEO_BASE64\",
            \"quote\": \"${{ github.event.client_payload.quote }}\"
          }"    
