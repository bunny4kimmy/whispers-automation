name: Render Daily Video

on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      # ── Fonts ────────────────────────────────────────────────────────────────
      # fonts-noto-color-emoji supplies the 🌿 glyph (U+1F33F).
      # DejaVu is kept for the quote / body text rendering.
      - name: Install font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu fonts-noto fonts-noto-color-emoji

      # ── Source image ─────────────────────────────────────────────────────────
      - name: Download Image from Drive
        run: |
          wget --no-check-certificate \
            'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' \
            -O input.jpg

      # ── Render Video ─────────────────────────────────────────────────────────
      - name: Render Video with Music
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # ── Pick background music ──────────────────────────────────────────
          SELECTED_MUSIC=$(find music -name "*.mp3" | shuf -n 1)
          echo "Selected track: $SELECTED_MUSIC"

          # ── Generate CTA via Gemini ────────────────────────────────────────
          # FIX 1: gemini-pro is deprecated → use gemini-1.5-flash.
          # Write the JSON payload to a temp file so special characters in
          # $QUOTE / $TITLE are safely handled by jq, not the shell.
          jq -n \
            --arg q "$QUOTE" \
            --arg t "$TITLE" \
            '{
              contents: [{
                parts: [{
                  text: ("Given the quote: " + $q + " and title: " + $t + ", generate a short reflective call-to-action question (one sentence, no hashtags) that feels empathetic and invites quiet engagement.")
                }]
              }],
              generationConfig: { maxOutputTokens: 80, temperature: 0.7 }
            }' > gemini_payload.json

          CTA=$(curl -s -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @gemini_payload.json \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            | jq -r '.candidates[0].content.parts[0].text // empty')

          # Strip leading/trailing whitespace; fall back if empty
          CTA=$(echo "$CTA" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$CTA" ]; then
            CTA="What does this moment teach you about patience?"
          fi

          echo "CTA resolved: $CTA"

          # Write text files used by FFmpeg drawtext
          printf '%s' "$QUOTE" > quote.txt
          printf '%s' "$CTA"   > cta.txt
          printf '%s' "$CTA"   > cta_cache.txt

          # FIX 2: Replace emoji with plain ASCII so DejaVu renders it cleanly.
          # The tilde ~ acts as a soft leaf-style bullet that DejaVu can render.
          printf 'Like if you needed this today  ~' > like.txt
          echo "like.txt contents: $(cat like.txt)"

          # ── Render with FFmpeg ────────────────────────────────────────────
          ffmpeg -loop 1 -i input.jpg \
            -stream_loop -1 -i "$SELECTED_MUSIC" \
            -vf "scale=8000:-1, \
          zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=textfile=quote.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf: \
            fontcolor=white:fontsize=55: \
            x=80:y=(h/3-text_h/2): \
            box=1:boxcolor=0x1E3741B8:boxborderw=40:line_spacing=20:fix_bounds=1, \
          drawtext=textfile=cta.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf: \
            fontcolor=white@0.85:fontsize=40: \
            x=80:y=(h*72/100): \
            box=1:boxcolor=0x00000000:boxborderw=0:line_spacing=18:fix_bounds=1, \
          drawtext=textfile=like.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf: \
            fontcolor=white@0.9:fontsize=36: \
            x=80:y=h-220: \
            box=1:boxcolor=black@0.25:boxborderw=16:fix_bounds=1" \
            -c:v libx264 -crf 28 -preset faster \
            -t 10 -pix_fmt yuv420p \
            -c:a aac -shortest \
            output.mp4

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      # ── Upload to YouTube ─────────────────────────────────────────────────────
      - name: Finalize and Upload to YouTube
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
        run: |
          # FIX 3: base64 of a video file is too large to pass as a shell
          # variable to `jq --arg` (hits OS ARG_MAX / kernel limit).
          # Write the base64 to a file and use `--rawfile` instead — jq reads
          # the file content directly without going through the env/arg space.
          base64 -w 0 output.mp4 > video_b64.txt
          CTA=$(cat cta_cache.txt)

          jq -n \
            --arg    action  "upload_to_youtube" \
            --rawfile video   video_b64.txt \
            --arg    quote   "$QUOTE" \
            --arg    cta     "$CTA" \
            --arg    ytTitle "$TITLE" \
            '{
              action:     $action,
              video_data: $video,
              quote:      $quote,
              cta:        $cta,
              ytTitle:    $ytTitle
            }' > payload.json

          curl -L -v \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.GAS_WEB_APP_URL }}"


