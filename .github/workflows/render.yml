name: Render Daily Video
on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      - name: Download Image from Drive
        run: |
          wget --no-check-certificate 'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' -O input.jpg

      - name: Render Video with FFmpeg
        run: |
          # 1. Scale image to cover the 1080x1920 area (Crop/Fill)
          # 2. Add slow zoom effect
          # 3. Wrap text into 25-character lines and center it
          # 4. Mix with music.mp3 (looping audio to match video length)
          # ffmpeg -loop 1 -i input.jpg -stream_loop -1 -i music.mp3 -vf "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)',scale=1080:1920,setsar=1,drawtext=text='${{ github.event.client_payload.quote }}':fontcolor=white:fontsize=55:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=black@0.4:boxborderw=30:line_spacing=15:text_w=w*0.8" -c:v libx264 -t 10 -pix_fmt yuv420p -c:a aac -shortest output.mp4
          SELECTED_MUSIC=$(ls music/*.mp3 | shuf -n 1)
          ffmpeg -loop 1 -i input.jpg -stream_loop -1 -i "$SELECTED_MUSIC" -vf "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)',scale=1080:1920,setsar=1,drawtext=text='${{ github.event.client_payload.quote }}':fontcolor=white:fontsize=55:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=black@0.4:boxborderw=30:line_spacing=15:text_w=w*0.8" -c:v libx264 -t 10 -pix_fmt yuv420p -c:a aac -shortest output.mp4 


      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4
