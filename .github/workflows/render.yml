name: Render Daily Video
on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      - name: Download Image from Drive
        run: |
          wget --no-check-certificate 'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' -O input.jpg

      - name: Render Video with Music
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Pick a random track safely
          SELECTED_MUSIC=$(find music -name "*.mp3" | shuf -n 1)
          echo "Selected track: $SELECTED_MUSIC"

          # 2. Generate CTA dynamically via Gemini API
          CTA=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":\"Given the quote: '$QUOTE' and title: '$TITLE', generate a short reflective call-to-action question that feels empathetic and invites engagement.\"}]}]}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=$GEMINI_API_KEY" \
            | jq -r '.candidates[0].content.parts[0].text')

          # 3. Save quote and CTA separately
          echo "$QUOTE" > quote.txt
          echo "$CTA" > cta.txt

          # 4. FFmpeg overlays quote, CTA, and gentle engagement line
          ffmpeg -loop 1 -i input.jpg -stream_loop -1 -i "$SELECTED_MUSIC" \
          -vf "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=textfile=quote.txt: \
          fontcolor=white:fontsize=55:x=(w-text_w)/2:y=(h/3-text_h/2): \
          box=1:boxcolor=black@0.5:boxborderw=40:line_spacing=20:fix_bounds=1, \
          drawtext=textfile=cta.txt: \
          fontcolor=white:fontsize=45:x=(w-text_w)/2:y=(2*h/3-text_h/2): \
          box=1:boxcolor=black@0.5:boxborderw=30:line_spacing=20:fix_bounds=1, \
          drawtext=text='Like if you needed this today 🌿': \
          fontcolor=white@0.85:fontsize=40:x=(w-text_w)/2:y=h-120: \
          box=1:boxcolor=black@0.3:boxborderw=20:fix_bounds=1" \
          -c:v libx264 -crf 28 -preset faster -t 10 -pix_fmt yuv420p -c:a aac -shortest output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      - name: Finalize and Upload to YouTube
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
        run: |
          # 1. Convert video to Base64
          VIDEO_BASE64=$(base64 -w 0 output.mp4)

          # 2. Create the payload
          cat <<EOF > payload.json
          {
            "action": "upload_to_youtube",
            "video_data": "$VIDEO_BASE64",
            "quote": "$QUOTE",
            "cta": "$CTA",
            "ytTitle": "$TITLE"
          }
          EOF

          # 3. Upload via Apps Script
          curl -L -v \
          -H "Content-Type: application/json" \
          -d @payload.json \
          "${{ secrets.GAS_WEB_APP_URL }}"


