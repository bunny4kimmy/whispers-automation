name: Render Daily Video
on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      - name: Download Image from Drive
        run: |
          wget --no-check-certificate 'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' -O input.jpg

      - name: Render Video with Music
        run: |
          # 1. Pick a random track
          SELECTED_MUSIC=$(ls music/*.mp3 | shuf -n 1)
          
          # 2. ESCAPING MAGIC: Prepare the quote for FFmpeg
          # This removes the newlines and replaces apostrophes so they don't break the filter
          CLEAN_QUOTE=$(echo "${{ github.event.client_payload.quote }}" | sed "s/'/\\\\\\'/g")

          # 3. Use the -filter_complex method (much more stable for multiline text)
          ffmpeg -loop 1 -i input.jpg -stream_loop -1 -i "$SELECTED_MUSIC" \
          -vf "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=text='$CLEAN_QUOTE': \
          fontcolor=white:fontsize=55:x=(w-text_w)/2:y=(h-text_h)/2: \
          box=1:boxcolor=black@0.5:boxborderw=40: \
          line_spacing=20:fix_bounds=1" \
          -c:v libx264 -t 10 -pix_fmt yuv420p -c:a aac -shortest output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      - name: Finalize and Upload to YouTube
        run: |
          VIDEO_BASE64=$(base64 -w 0 output.mp4)
          
          cat <<EOF > payload.json
          {
            "action": "upload_to_youtube",
            "video_data": "$VIDEO_BASE64",
            "quote": "${{ github.event.client_payload.quote }}"
          }
          EOF
          
          # Added -v (verbose) to see the conversation and -f (fail) to stop if Google errors
          curl -v -f -L --max-time 300 -X POST "${{ secrets.GAS_WEB_APP_URL }}" \
          -H "Content-Type: application/json" \
          -d @payload.jsono Google with a longer timeout (--max-time)
          curl -L --max-time 300 -X POST "${{ secrets.GAS_WEB_APP_URL }}" \
          -H "Content-Type: application/json" \
          -d @payload.json
