name: Render Daily Video

on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      # Install Noto fonts so the leaf glyph (❧) is available via DejaVu fallback.
      # NotoColorEmoji is intentionally NOT used as an FFmpeg fontfile — it breaks
      # Latin text rendering. We use a safe Unicode leaf from DejaVuSerif instead.
      - name: Install font dependencies
        run: sudo apt-get install -y fonts-noto fonts-dejavu

      - name: Download Image from Drive
        run: |
          wget --no-check-certificate \
            'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' \
            -O input.jpg

      - name: Render Video with Music
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SELECTED_MUSIC=$(find music -name "*.mp3" | shuf -n 1)
          echo "Selected track: $SELECTED_MUSIC"

          # --- FIX 1: Use jq to build the JSON payload safely ---
          # Raw shell interpolation inside JSON breaks on apostrophes and special
          # characters in QUOTE/TITLE. jq --arg escapes everything correctly.
          GEMINI_PAYLOAD=$(jq -n \
            --arg q "$QUOTE" \
            --arg t "$TITLE" \
            '{
              contents: [{
                parts: [{
                  text: ("Given the quote: \'" + $q + "\' and title: \'" + $t + "\', generate a short reflective call-to-action question (one sentence, no hashtags) that feels empathetic and invites quiet engagement.")
                }]
              }]
            }')

          CTA=$(curl -s -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$GEMINI_PAYLOAD" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=$GEMINI_API_KEY" \
            | jq -r '.candidates[0].content.parts[0].text // empty')

          # --- FIX 2: Robust fallback — catches null, empty, and whitespace-only ---
          CTA=$(echo "$CTA" | xargs)   # strip surrounding whitespace/newlines
          if [ -z "$CTA" ]; then
            CTA="What does this moment teach you about patience?"
          fi

          echo "CTA resolved: $CTA"
          echo "$QUOTE" > quote.txt
          echo "$CTA"   > cta.txt
          echo "$CTA"   > cta_cache.txt

          # --- FIX 3: Leaf rendered as Unicode glyph ❧ (U+2767) from DejaVuSerif ---
          # Do NOT use NotoColorEmoji.ttf as fontfile — it cannot render Latin text.
          # Do NOT wrap text in *asterisks* — FFmpeg drawtext prints them literally.
          # The like line is left-anchored at x=80 (safe zone, clears platform icons).
          ffmpeg -loop 1 -i input.jpg \
            -stream_loop -1 -i "$SELECTED_MUSIC" \
            -vf "scale=8000:-1, \
          zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=textfile=quote.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf: \
            fontcolor=white:fontsize=55: \
            x=80:y=(h/3-text_h/2): \
            box=1:boxcolor=0x1E3741B8:boxborderw=40:line_spacing=20:fix_bounds=1, \
          drawtext=textfile=cta.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf: \
            fontcolor=white@0.85:fontsize=40: \
            x=80:y=(h*72/100): \
            box=1:boxcolor=0x00000000:boxborderw=0:line_spacing=18:fix_bounds=1, \
          drawtext=text='Like if you needed this today  \u2767': \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf: \
            fontcolor=white@0.9:fontsize=36: \
            x=80:y=h-220: \
            box=1:boxcolor=black@0.25:boxborderw=16:fix_bounds=1" \
            -c:v libx264 -crf 28 -preset faster \
            -t 10 -pix_fmt yuv420p \
            -c:a aac -shortest \
            output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      - name: Finalize and Upload to YouTube
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
        run: |
          VIDEO_BASE64=$(base64 -w 0 output.mp4)
          CTA=$(cat cta_cache.txt)

          # --- FIX 4: Use jq to build upload payload safely ---
          # Direct heredoc interpolation corrupts JSON when QUOTE/CTA contain
          # quotes, newlines, or backslashes. jq --arg handles all escaping.
          jq -n \
            --arg action  "upload_to_youtube" \
            --arg video   "$VIDEO_BASE64" \
            --arg quote   "$QUOTE" \
            --arg cta     "$CTA" \
            --arg ytTitle "$TITLE" \
            '{
              action:     $action,
              video_data: $video,
              quote:      $quote,
              cta:        $cta,
              ytTitle:    $ytTitle
            }' > payload.json

          curl -L -v \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.GAS_WEB_APP_URL }}"



