name: Render Daily Video

on:
  repository_dispatch:
    types: [render_video]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: animmouse/setup-ffmpeg@v1
        with:
          version: '7.1'

      # fonts-noto-color-emoji supplies the leaf glyph fallback.
      # DejaVu handles all Latin quote / CTA text.
      - name: Install font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu fonts-noto fonts-noto-color-emoji python3

      # ── Source image ──────────────────────────────────────────────────────────
      - name: Download Image from Drive
        run: |
          wget --no-check-certificate \
            'https://docs.google.com/uc?export=download&id=${{ github.event.client_payload.file_id }}' \
            -O input.jpg

      # ── Render Video ──────────────────────────────────────────────────────────
      - name: Render Video with Music
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SELECTED_MUSIC=$(find music -name "*.mp3" | shuf -n 1)
          echo "Selected track: $SELECTED_MUSIC"

          # ── Generate CTA via Gemini ──────────────────────────────────────
          jq -n \
            --arg q "$QUOTE" \
            --arg t "$TITLE" \
            '{
              contents: [{
                parts: [{
                  text: ("Given the quote: " + $q + " and title: " + $t + ", generate a short reflective call-to-action question (one sentence, no hashtags, under 60 characters) that feels empathetic and invites quiet engagement.")
                }]
              }],
              generationConfig: { maxOutputTokens: 60, temperature: 0.7 }
            }' > gemini_payload.json

          CTA=$(curl -s -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @gemini_payload.json \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            | jq -r '.candidates[0].content.parts[0].text // empty')

          CTA=$(echo "$CTA" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$CTA" ]; then
            CTA="What does this moment teach you about patience?"
          fi

          echo "CTA resolved: $CTA"

          # ── Write quote.txt ──────────────────────────────────────────────
          printf '%s' "$QUOTE" > quote.txt

          # ── Wrap CTA into max ~38 chars per line so it fits left of the
          #    platform icon rail (safe zone ends ~72% of 1080px = ~778px).
          #    Python's textwrap is the cleanest way to do this in bash.
          python3 - "$CTA" << 'PYEOF'
          import sys, textwrap
          text = sys.argv[1]
          wrapped = textwrap.fill(text, width=38)
          with open("cta.txt", "w") as f:
              f.write(wrapped)
          with open("cta_cache.txt", "w") as f:
              f.write(text)   # cache keeps the original single-line CTA for the payload
          PYEOF

          echo "cta.txt:"
          cat cta.txt

          # ── Like line — plain ASCII, safe for DejaVu ─────────────────────
          # Positioned well above the channel-name overlay:
          #   YouTube channel bar starts ~h-180, so we place this at h-320
          #   giving ~140px clear breathing room.
          printf 'Like if you needed this today' > like.txt

          # ── FFmpeg render ────────────────────────────────────────────────
          # Layout (1080x1920):
          #   Quote block  : y = h/3 - text_h/2          (~upper third)
          #   CTA (2 lines): y = h*70/100                 (~70% — safe above icons)
          #   Like line    : y = h-320                    (~83% — above channel overlay)
          #
          # Right-edge safety: x=80, font 40px, ~38 chars ≈ 760px → ends at ~840px
          # Platform icon rail starts at ~860px — 20px clearance.
          ffmpeg -loop 1 -i input.jpg \
            -stream_loop -1 -i "$SELECTED_MUSIC" \
            -vf "scale=8000:-1, \
          zoompan=z='min(zoom+0.0008,1.3)':d=250:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', \
          scale=1080:1920,setsar=1, \
          drawtext=textfile=quote.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf: \
            fontcolor=white:fontsize=55: \
            x=80:y=(h/3-text_h/2): \
            box=1:boxcolor=0x1E3741B8:boxborderw=40:line_spacing=20:fix_bounds=1, \
          drawtext=textfile=cta.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf: \
            fontcolor=white@0.85:fontsize=40: \
            x=80:y=(h*70/100): \
            box=1:boxcolor=0x00000000:boxborderw=0:line_spacing=18:fix_bounds=1, \
          drawtext=textfile=like.txt: \
            fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf: \
            fontcolor=white@0.92:fontsize=34: \
            x=80:y=h-320: \
            box=1:boxcolor=black@0.30:boxborderw=20:fix_bounds=1" \
            -c:v libx264 -crf 28 -preset faster \
            -t 10 -pix_fmt yuv420p \
            -c:a aac -shortest \
            output.mp4

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-resilience-video
          path: output.mp4

      # ── Upload to YouTube ─────────────────────────────────────────────────────
      - name: Finalize and Upload to YouTube
        env:
          QUOTE: ${{ github.event.client_payload.quote }}
          TITLE: ${{ github.event.client_payload.ytTitle }}
        run: |
          base64 -w 0 output.mp4 > video_b64.txt
          CTA=$(cat cta_cache.txt)

          jq -n \
            --arg    action  "upload_to_youtube" \
            --rawfile video   video_b64.txt \
            --arg    quote   "$QUOTE" \
            --arg    cta     "$CTA" \
            --arg    ytTitle "$TITLE" \
            '{
              action:     $action,
              video_data: $video,
              quote:      $quote,
              cta:        $cta,
              ytTitle:    $ytTitle
            }' > payload.json

          curl -L -v \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.GAS_WEB_APP_URL }}"


